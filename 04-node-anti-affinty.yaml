apiVersion: v1
kind: Pod
metadata:
  name: node-anti-affinity
spec:
   affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      ## hard rule
        nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                - us-east-1d
   containers:
   - name: nginx
     image: nginx
     imagePullPolicy: Always
